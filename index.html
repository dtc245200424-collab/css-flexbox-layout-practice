<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Layout - Thực hành CodeGym</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <h1>Header - Tiêu Đề Trang Web</h1>
      </header>

      <!-- Navigation -->
      <nav class="nav">
        <p>Navigation - Menu điều hướng</p>
      </nav>

      <!-- Main Container (Chứa Content & Sidebar) -->
      <div class="main-container">
        <main class="content">
          <h2>Main Content</h2>
          <p>
            Đây là khu vực hiển thị nội dung chính của trang web được sắp xếp
            linh hoạt bằng Flexbox.
          </p>
        </main>
        <aside class="sidebar">
          <h3>Sidebar</h3>
          <p>Nội dung phụ / Tin tức / Quảng cáo</p>
        </aside>
      </div>

      <!-- Footer -->
      <footer class="footer">
        <p>Footer - Bản quyền &copy; 2026 CodeGym Practice</p>
      </footer>
    </div>
  </body>
</html>
